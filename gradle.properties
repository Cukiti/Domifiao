# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ============================================
# OPTIMIZACION DE GRADLE
# ============================================

# Memoria JVM para Gradle Daemon (ajustar según tu RAM)
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Habilitar Gradle Daemon (mejora velocidad de builds)
org.gradle.daemon=true

# Compilación paralela (acelera builds multi-módulo)
org.gradle.parallel=true

# Configuración de cache
org.gradle.caching=true
org.gradle.configureondemand=true

# ============================================
# ANDROID
# ============================================

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Reducir tamaño de R class
android.nonTransitiveRClass=true

# Suprimir advertencia de SDK 35
android.suppressUnsupportedCompileSdk=35

# Desactivar logging de performance del Gradle Daemon
org.gradle.daemon.performance.disable-logging=true

# ============================================
# KOTLIN
# ============================================

# Incremental compilation
kotlin.incremental=true
kotlin.incremental.js=true

# ============================================
# BUILD OPTIMIZATION
# ============================================

# Enable configuration cache (experimental)
# org.gradle.configuration-cache=true

# Skip tests during initial Gradle sync (mejora velocidad de sincronización en Android Studio)
android.experimental.testOptions.emulatorControl=false

# DESACTIVADO TEMPORALMENTE - Puede causar problemas de sync en Android Studio
# org.gradle.configuration-cache=true